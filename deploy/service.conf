# What the service is, independent of who runs it.
#
# Every value here is passed on every deploy. That is what makes the deploy
# idempotent: the running service is a function of this file, not of the
# sequence of commands anyone has typed at it since. Before this existed, the
# request timeout and the MCP allowed-hosts list lived only in deployed state
# — set by hand, absent from the repository, and gone the moment the service
# was recreated.
#
# Deliberately cloud-neutral. CPU, memory, concurrency, request timeout and a
# ceiling on instances are the five knobs every container platform has; the
# provider script is where they become that platform's spelling.

SERVICE_NAME=book-catalogue
CONTAINER_PORT=8080

CPU=1
MEMORY=512Mi
# One request holds one database connection out of a pool of five, so
# concurrency well above the pool only queues work inside the process.
CONCURRENCY=40
MAX_INSTANCES=3

# 20 seconds. Measured: the slowest legitimate request over 24 hours was 7.26s,
# a cold start. This is 2.7x that, which leaves room for a database cold-wake
# on top — and it caps what a client can cost by holding a connection open,
# which is how a scale-to-zero service came to be billed around the clock.
REQUEST_TIMEOUT_SECONDS=20

# Every hostname the service answers on. The MCP transport refuses anything
# not listed here with 421, and the SDK supports wildcards for ports but not
# for hosts — so each name has to be spelled out. Cloud Run publishes two URLs
# per service and the second one was refusing MCP unnoticed until a staging
# deploy tried to use it.
API_MCP_ALLOWED_HOSTS='["book-catalogue-27035467540.europe-west2.run.app","book-catalogue-gskpr6nxca-nw.a.run.app","staging---book-catalogue-gskpr6nxca-nw.a.run.app","127.0.0.1","localhost"]'

# Named, never inlined. A connection string in a deployment config is readable
# by anyone with console access and shows up in every describe.
DATABASE_URL_SECRET=catalogue-database-url
