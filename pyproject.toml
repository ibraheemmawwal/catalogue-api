[project]
name = "catalogue-api"
version = "0.1.0"
description = "Read-only HTTP and MCP API over the book catalogue."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    # SQLAlchemy's async layer needs greenlet and does not always pull it in
    # on this platform; without it every database call raises at runtime while
    # /live still answers 200, so the service looks healthy and serves nothing.
    "greenlet>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    # Not an optional extra: the MCP server mounts into the same ASGI app, so
    # an image without it serves half the product.
    "mcp>=2.0,<3",
]

[project.scripts]
catalogue-api = "api.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.165.3",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PL", "RUF", "ASYNC"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
# ARG: a pytest fixture is requested by parameter name, so one used purely for
# its side effect — seeding and truncating the database — reads as unused.
"tests/*" = ["PLR2004", "S101", "ARG001", "ARG002"]
# uvicorn and httpx are imported inside the MCP session helper so the module
# still collects when only unit tests are being run.
"tests/integration/test_mcp_tools.py" = ["PLC0415"]
# A FastAPI handler's parameters *are* its documented query string. Collapsing
# them into an object to satisfy an argument count would remove them from
# OpenAPI, which is a worse trade than a long signature.
"src/api/routers/*" = ["PLR0913", "PLR0917"]
# An MCP tool's parameters *are* its JSON schema, derived from these hints.
# Collapsing them into an object would hide the filters from the model.
"src/api/mcp/server.py" = ["PLR0913", "PLR0917"]
"src/api/mcp/tools.py" = ["PLR0913", "PLR0917"]
# BookFilters takes one keyword per filter for the same reason: each maps to a
# query parameter, and grouping them would only move the count elsewhere.
"src/api/repositories/books.py" = ["PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["mcp.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# No coverage gate here. The SQL in repositories/ is exercised only against a
# real database, so a unit-only gate would either fail honestly or be lowered
# until it means nothing. The gate lives on the combined report — see the
# coverage job in CI, and `make coverage` locally.
addopts = "--strict-markers"
markers = [
    "integration: requires a PostgreSQL database",
    "contract: verifies the pipeline schema contract",
]

[tool.coverage.run]
branch = true
source = ["src"]
